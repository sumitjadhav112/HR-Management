<div class="expense-container">
  <a routerLink="/homepage" class="back-arrow">&larr;</a>
  <h2>Add Expense</h2>
  <form [formGroup]="expenseForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <input
        id="type"
        formControlName="type"
        type="text"
        class="form-control"
        placeholder=" "
      />
      <label for="type">Expense Type</label>
      <div *ngIf="expenseForm.get('type')?.invalid && expenseForm.get('type')?.touched" class="error-message">
        Expense type is required.
      </div>
    </div>
    
    <div class="form-group">
      <input
        id="amount"
        formControlName="amount"
        type="number"
        class="form-control"
        placeholder=" "
      />
      <label for="amount">Amount</label>
      <div *ngIf="expenseForm.get('amount')?.invalid && expenseForm.get('amount')?.touched" class="error-message">
        Amount is required and must be greater than 0.
      </div>
    </div>
    
    <div class="form-group">
      <input
        id="date"
        formControlName="date"
        type="date"
        class="form-control"
        placeholder=" "
      />
      <label for="date">Date</label>
      <div *ngIf="expenseForm.get('date')?.invalid && expenseForm.get('date')?.touched" class="error-message">
        Date is required.
      </div>
    </div>
    
    <button type="submit" [disabled]="expenseForm.invalid" class="btn-submit">
      Add Expense
    </button>
  </form>
</div>
