<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
  <title>Document</title>
</head>
<body>
  <div class="login-container">
    <h1>Login</h1>
    <form [formGroup]="LoginData" (ngSubmit)="LoginFormSubmit()">
      <div class="form-group">
        <input
          type="number"
          id="mobile_number"
          placeholder="Mobile Number"
          formControlName="mobile_number"
          maxlength="10"
          (keypress)="validateMobileNumber($event)"
        />
        <label for="mobile_number">Mobile Number</label>
        <div
          *ngIf="
            LoginData.get('mobile_number')!.invalid &&
            LoginData.get('mobile_number')!.touched
          "
          class="error-message"
        >
          Mobile number is required.
        </div>
      </div>
      <div class="form-group">
        <input
        [type]="showPassword ? 'text' : 'password'"
        id="password"
          maxlength="25"
          placeholder="Password"
          formControlName="password"
        />
        <i 
        class="password-toggle-icon fas" 
        [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"
        (click)="togglePasswordVisibility()"
      ></i>
        <label for="password">Password</label>
        <div
          *ngIf="
            LoginData.get('password')!.invalid &&
            LoginData.get('password')!.touched
          "
          class="error-message"
        >
          Password is required.
        </div>
      </div>
      <button type="submit" [disabled]="LoginData.invalid">Login</button>
    </form>
  </div> 
</body>
</html>
